<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atha Store - Akun Mobile Legends</title>
<style>
:root{--bg:#0b1230;--bx:#142050;--bd:#2f4690;--ac:#2d5bff;--gd:#ffd678}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#e8eeff}
header{padding:14px 16px;text-align:center;border-bottom:1px solid var(--bd)}header b{color:var(--gd);font-size:22px}
nav{display:flex;gap:8px;padding:10px 16px}nav button{flex:1}
button,input,select,textarea{font:inherit;font-size:14px;padding:9px;border-radius:8px;border:1px solid #3a56b0;background:#0d1840;color:#fff}
button{background:var(--ac);border:0;font-weight:700;cursor:pointer}button.g{background:#1f9d55}button.r{background:#b3261e}button.o{background:#27346e}
main{padding:0 16px 24px;max-width:1100px;margin:auto}.box{background:var(--bx);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;margin:8px 0 4px;color:#a9bbff}input[type=text],textarea{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.c{background:#0d1840;border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:12px}.c.off{opacity:.4}
.c canvas{width:100%;height:auto;border-radius:6px;display:block;margin-bottom:4px}.c select{width:100%;padding:4px;font-size:12px}
.sh{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.it{background:var(--bx);border:1px solid var(--bd);border-radius:12px;overflow:hidden}.it img{width:100%;height:260px;object-fit:cover;object-position:top;display:block;cursor:pointer}
.it div{padding:10px}.pr{color:var(--gd);font-weight:800;font-size:18px}small{color:#8fa3e8}.hide{display:none}
#out{max-width:100%;border-radius:8px;margin-top:10px}
#view{position:fixed;inset:0;background:#000d;overflow:auto;padding:10px}#view img{width:100%;max-width:900px;display:block;margin:auto}
</style></head><body>
<header><b>ATHA STORE</b><br><small>Akun Mobile Legends</small></header>
<nav><button id="t1">Etalase</button><button id="t2" class="o">Admin: Buat Gambar</button></nav>
<main>
<section id="p1"><div id="sh" class="sh"></div><p id="empty"><small>Belum ada akun dijual.</small></p></section>

<section id="p2" class="hide">
 <div class="box"><label>1. Upload screenshot Koleksi &gt; Skin (landscape, 1 baris kartu utuh per foto)</label>
  <input type="file" id="files" accept="image/*" multiple> <div id="shots"></div><small id="prog"></small></div>
 <div class="box"><label>2. Info header</label>
  <input type="text" id="brand" value="ATHA STORE"><label>Nomor WA</label><input type="text" id="wa" value="0881-7055-190">
  <label>Baris 1</label><input type="text" id="l1" placeholder="Koleksi Skin 310/1164"><label>Baris 2</label><input type="text" id="l2" placeholder="Win Rate 57% | 6130 Match | 1038 MVP">
  <label>Watermark</label><input type="text" id="wm" value="ATHA STORE 0881-7055-190"></div>
 <div class="box"><label>3. Cek hasil tebakan OCR (ubah kategori bila salah)</label><div id="cards" class="grid"></div></div>
 <div class="box"><button id="gen">Buat Gambar</button> <button id="sv" class="g hide">Simpan ke Etalase</button> <button id="dl" class="o hide">Download PNG</button>
  <div><canvas id="out" class="hide"></canvas></div></div>
</section></main>
<div id="view" class="hide"><img id="vi"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const ADMIN_PIN='ganti-pin-ini';           // ganti! (masih client-side; pakai Supabase Auth untuk yang aman)
const WA_JUAL='628817055190';
const $=id=>document.getElementById(id);
const XS=[567,914,1261,1608,1955],CW=290,CH=476;
const TAGS=['Prime','KOF / Leona','Collector','Star','Luckybox','V.E.N.O.M.','Lightborn','Dragon Tamer','S.A.B.E.R.','Blazing Bounties','M-Series','Zodiac','S.T.U.N.','Epic / Lainnya','Star 200','Buang'];
const TABDEF={Grand:'Prime','2000':'Collector','400':'Epic / Lainnya','200':'Buang'};
let cards=[],unlocked=false;

// ---------- Navigasi ----------
$('t1').onclick=()=>{$('p1').classList.remove('hide');$('p2').classList.add('hide');showAll()};
$('t2').onclick=()=>{ if(!unlocked){ if(prompt('PIN admin:')!==ADMIN_PIN)return; unlocked=true; }
  $('p2').classList.remove('hide');$('p1').classList.add('hide');showAll()};
function showAll(){renderShop()}

// ---------- Etalase (localStorage; ganti ke Supabase nanti) ----------
const load=()=>{try{return JSON.parse(localStorage.getItem('atha_akun')||'[]')}catch(e){return[]}};
const save=a=>{try{localStorage.setItem('atha_akun',JSON.stringify(a));return true}catch(e){alert('Penyimpanan penuh. Hapus akun lama atau pakai Supabase.');return false}};
function renderShop(){
  const a=load(); $('sh').innerHTML=''; $('empty').classList.toggle('hide',a.length>0);
  a.forEach((it,i)=>{
    const d=document.createElement('div');d.className='it';
    const msg=encodeURIComponent('Halo Atha Store, saya mau beli akun ML: '+it.title+' ('+it.price+')');
    d.innerHTML='<img alt=""><div><b></b><div class="pr"></div><small></small><p><a href="https://wa.me/'+WA_JUAL+'?text='+msg+'" target="_blank"><button class="g" style="width:100%">Beli via WhatsApp</button></a></p></div>';
    d.querySelector('img').src=it.img; d.querySelector('img').onclick=()=>{$('vi').src=it.img;$('view').classList.remove('hide')};
    d.querySelector('b').textContent=it.title; d.querySelector('.pr').textContent=it.price; d.querySelector('small').textContent=it.desc||'';
    if(unlocked){const b=document.createElement('button');b.className='r';b.textContent='Hapus';b.onclick=()=>{if(confirm('Hapus?')){a.splice(i,1);save(a);renderShop()}};d.lastChild.append(b)}
    $('sh').append(d);
  });
}
$('view').onclick=()=>$('view').classList.add('hide');
renderShop();

// ---------- Upload + deteksi kartu ----------
const loadImg=f=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(f)});
$('files').onchange=async e=>{
  cards=[];$('shots').innerHTML='';$('cards').innerHTML='';
  for(const f of e.target.files){
    const img=await loadImg(f), sel=document.createElement('select');
    ['Grand','2000','400','200'].forEach(t=>sel.add(new Option('Tab '+t,t)));sel.value='400';
    const row=document.createElement('div');row.append(f.name+' → ',sel);$('shots').append(row);
    const res=analyze(img); if(!res){row.append(' ⚠ baris tidak terdeteksi');continue}
    res.forEach(r=>{r.sel=sel;cards.push(r)});
  }
  await runOCR(); renderCards();
};
function analyze(img){
  const s=img.width/2532,cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
  const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);
  const d=x.getImageData(0,0,cv.width,cv.height).data,W=cv.width,cnt=[];
  const x0=Math.round(570*s),x1=Math.round(2240*s);
  for(let y=0;y<img.height;y++){let c=0;for(let X=x0;X<x1;X++){const i=(y*W+X)*4;
    if(Math.abs(d[i]-81)<30&&Math.abs(d[i+1]-184)<22&&Math.abs(d[i+2]-158)<28)c++}cnt.push(c)}
  const lo=621*s,hi=1040*s,gs=[];let st=null,pv=null,sum=0;
  for(let y=Math.round(600*s);y<Math.round(1060*s);y++){
    if(cnt[y]>8*s){if(st===null){st=y;sum=0}sum+=cnt[y];pv=y}else if(st!==null&&y-pv>3){gs.push([st,pv,sum]);st=null}}
  if(st!==null)gs.push([st,pv,sum]);
  const g=gs.filter(a=>{const m=(a[0]+a[1])/2;return m>=lo&&m<=hi}).sort((a,b)=>b[2]-a[2])[0]; if(!g)return null;
  const nameY=(g[0]+g[1])/2/s,top=nameY-398,out=[];
  for(let c=0;c<5;c++){
    const cc=document.createElement('canvas');cc.width=CW;cc.height=CH;
    cc.getContext('2d').drawImage(img,XS[c]*s,top*s,CW*s,CH*s,0,0,CW,CH);
    let n=0;for(let Y=Math.round((nameY+26)*s);Y<Math.round((nameY+64)*s);Y++)for(let X=Math.round((XS[c]+10)*s);X<Math.round((XS[c]+280)*s);X++){
      const i=(Y*W+X)*4;if(d[i+2]>200&&d[i+1]>170)n++}
    out.push({canvas:cc,owned:n>=60*s*s,tag:'Buang',name:''});
  }
  return out;
}

// ---------- OCR (Tesseract.js) + tebakan kategori ----------
function strip(cc,x,y,w,h){const t=document.createElement('canvas');t.width=w*2;t.height=h*2;const q=t.getContext('2d');
  q.drawImage(cc,x,y,w,h,0,0,w*2,h*2);return t}
function guess(txt,tab){
  const t=txt.toLowerCase();
  if(tab==='Grand'&&/fight|kof|king/.test(t))return 'KOF / Leona';
  if(/v\.?e\.?n\.?[od]\.?m|venom|vend/.test(t))return 'V.E.N.O.M.';
  if(/lightb|ightborn/.test(t))return 'Lightborn';
  if(/dragon|tamer/.test(t))return 'Dragon Tamer';
  if(/s\.?a\.?b\.?e\.?r|saber/.test(t))return 'S.A.B.E.R.';
  if(/blazing|bount/.test(t))return 'Blazing Bounties';
  if(/\bm[5-9]\b|m6|m7/.test(t))return 'M-Series';
  if(/zodiac/.test(t))return 'Zodiac';
  if(/s\.?t\.?u\.?n/.test(t))return 'S.T.U.N.';
  if(/collector/.test(t))return 'Collector';
  if(/luckybox|lucky/.test(t))return 'Luckybox';
  if(/prime/.test(t))return 'Prime';
  if(/star/.test(t))return tab==='200'?'Star 200':'Star';
  return null;
}
async function runOCR(){
  if(!cards.length)return; if(!window.Tesseract){$('prog').textContent='OCR gagal dimuat (cek internet). Pilih kategori manual.';setDefaults();return}
  const w=await Tesseract.createWorker('eng');
  for(let i=0;i<cards.length;i++){
    const c=cards[i];$('prog').textContent='OCR '+(i+1)+'/'+cards.length+'...';
    try{
      const a=(await w.recognize(strip(c.canvas,10,372,270,40))).data.text;       // nama skin
      const b=(await w.recognize(strip(c.canvas,120,18,170,60))).data.text;       // label tema di pojok atas
      c.name=a.trim();c.hint=guess(a+' '+b,c.sel.value);
    }catch(e){c.hint=null}
  }
  await w.terminate();$('prog').textContent='OCR selesai. Cek ulang kategori di bawah.';setDefaults();
}
function setDefaults(){cards.forEach(c=>{
  const tab=c.sel.value;
  c.tag=!c.owned?'Buang':(c.hint||TABDEF[tab]);
  if(tab==='200'&&c.tag!=='Star 200')c.tag='Buang';   // tab 200: hanya Star
})}

function renderCards(){
  $('cards').innerHTML='';
  cards.forEach(c=>{
    const el=document.createElement('div');el.className='c'+(c.tag==='Buang'?' off':'');
    const cv=document.createElement('canvas');cv.width=CW;cv.height=CH;cv.getContext('2d').drawImage(c.canvas,0,0);
    const s=document.createElement('select');TAGS.forEach(t=>s.add(new Option(t,t)));s.value=c.tag;
    s.onchange=()=>{c.tag=s.value;el.className='c'+(c.tag==='Buang'?' off':'')};
    el.append(cv,s);const n=document.createElement('small');n.textContent=(c.owned?'':'[belum dimiliki] ')+(c.name||'');el.append(n);$('cards').append(el)});
}

// ---------- Buat gambar ----------
$('gen').onclick=()=>{
  const use=TAGS.slice(0,-1).flatMap(t=>cards.filter(c=>c.tag===t)); if(!use.length)return alert('Belum ada kartu terpilih');
  const W=1800,M=12,G=8,cw=190,ch=Math.round(476*190/290),cols=9,HH=210,H=HH+Math.ceil(use.length/cols)*(ch+G)+M+52;
  const cv=$('out');cv.width=W;cv.height=H;cv.classList.remove('hide');const x=cv.getContext('2d');
  const gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0a1440');gr.addColorStop(1,'#080e26');x.fillStyle=gr;x.fillRect(0,0,W,H);
  x.textAlign='center';x.textBaseline='middle';const br=$('brand').value,wa=$('wa').value;
  x.font='bold 64px sans-serif';x.fillStyle='#ffd678';x.strokeStyle='#3c1e00';x.lineWidth=4;x.strokeText(br,W/2,50);x.fillText(br,W/2,50);
  x.font='bold 30px sans-serif';x.fillStyle='#fff';x.fillText('WA: '+wa,W/2,102);x.font='bold 34px sans-serif';x.fillText($('l1').value,W/2,150);
  x.font='bold 26px sans-serif';x.fillStyle='#ffe28c';x.fillText($('l2').value,W/2,186);
  use.forEach((c,i)=>x.drawImage(c.canvas,M+(i%cols)*(cw+G),HH+Math.floor(i/cols)*(ch+G),cw,ch));
  x.fillStyle='#080e26';x.fillRect(0,H-52,W,52);x.font='bold 28px sans-serif';x.fillStyle='#ffd678';x.fillText(br+'  |  WA '+wa,W/2,H-26);
  x.save();x.translate(W/2,H/2);x.rotate(-28*Math.PI/180);x.font='bold 34px sans-serif';x.fillStyle='rgba(255,255,255,.18)';
  const t=$('wm').value,R=Math.hypot(W,H);for(let y=-R,k=0;y<R;y+=520,k++)for(let X=-R+(k%2)*450;X<R;X+=900)x.fillText(t,X,y);x.restore();
  $('sv').classList.remove('hide');$('dl').classList.remove('hide');
};
$('dl').onclick=()=>$('out').toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='akun-mlbb.png';a.click()});
$('sv').onclick=()=>{
  const title=prompt('Judul akun (mis. Akun ML Sultan 310 Skin):');if(!title)return;const price=prompt('Harga (mis. Rp1.500.000):');if(!price)return;
  const desc=prompt('Keterangan singkat (boleh kosong):')||'';
  const o=$('out'),t=document.createElement('canvas');t.width=1200;t.height=Math.round(o.height*1200/o.width);
  t.getContext('2d').drawImage(o,0,0,t.width,t.height);
  const a=load();a.unshift({title,price,desc,img:t.toDataURL('image/jpeg',.8)});if(save(a)){alert('Tersimpan di etalase');renderShop()}
};
</script></body></html>
