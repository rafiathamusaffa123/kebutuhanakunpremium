<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ATHA STORE | Premium Digital Account</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 20%, #f5f9ff, #eef2fa);
      color: #1a2c3e;
      overflow-x: hidden;
    }

    /* modern glass morphism */
    .glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      padding: 20px 32px;
      background: rgba(18, 52, 77, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255,255,240,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFF, #a0e7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }
    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .nav-links a, .nav-links button {
      background: transparent;
      border: none;
      color: #eef5ff;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.95rem;
      padding: 8px 16px;
      border-radius: 40px;
      transition: 0.2s;
    }
    .nav-links a:hover, .nav-links button:hover {
      background: rgba(255,255,255,0.15);
    }
    .user-badge {
      background: #2c6e8f;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* hero */
    .hero {
      text-align: center;
      padding: 60px 20px 40px;
    }
    .hero h1 {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(145deg, #1c5d7a, #0f3e53);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero p {
      max-width: 600px;
      margin: 20px auto;
      color: #3a5f74;
    }

    /* product grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 30px;
      margin: 40px 0;
    }
    .product-card {
      background: white;
      border-radius: 36px;
      padding: 24px;
      transition: all 0.3s ease;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0,0,0,0.03);
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 30px 40px -18px rgba(0, 50, 70, 0.2);
      border-color: #cbe2ef;
    }
    .product-icon {
      font-size: 2.5rem;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef5fc;
      border-radius: 24px;
      margin-bottom: 20px;
      color: #2c7a9e;
    }
    .product-name {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
      margin: 12px 0 10px;
    }
    .price-stock {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 16px 0;
      font-weight: 600;
    }
    .price {
      font-size: 1.3rem;
      color: #1e6a50;
      background: #e2f3ec;
      padding: 4px 12px;
      border-radius: 40px;
    }
    .stock {
      background: #ecf3f8;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.8rem;
    }
    .stock.low {
      background: #ffedd5;
      color: #b45309;
    }
    .order-btn {
      background: #25D366;
      width: 100%;
      border: none;
      padding: 12px;
      border-radius: 50px;
      font-weight: 700;
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .order-btn:disabled {
      background: #b9dac9;
      cursor: not-allowed;
    }

    /* modal modern */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-card {
      background: white;
      max-width: 450px;
      width: 90%;
      border-radius: 40px;
      padding: 32px;
      animation: fadeUp 0.25s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-card h3 {
      font-size: 1.7rem;
      margin-bottom: 20px;
    }
    .modal-card input, .modal-card select {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 60px;
      font-size: 0.9rem;
    }
    .role-select {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .role-opt {
      flex: 1;
      text-align: center;
      padding: 8px;
      background: #eef2f6;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.2s;
    }
    .role-opt.active {
      background: #2c7a9e;
      color: white;
    }
    .modal-card button {
      width: 100%;
      padding: 12px;
      border-radius: 60px;
      background: #1d6f8f;
      color: white;
      border: none;
      font-weight: 600;
      margin-top: 8px;
    }
    .switch-link {
      text-align: center;
      margin-top: 16px;
      color: #2c7a9e;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* admin panel */
    .admin-panel, .orders-panel {
      background: white;
      border-radius: 32px;
      padding: 28px;
      margin: 30px 0;
      box-shadow: 0 15px 35px rgba(0,0,0,0.05);
    }
    .tab-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
    }
    .tab {
      background: none;
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab.active {
      background: #1d6f8f;
      color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 6px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    input.small-input {
      width: 80px;
      padding: 6px;
      border-radius: 30px;
      border: 1px solid #ccc;
    }
    .backup-wa {
      background: #25D366;
      margin-top: 20px;
      display: inline-block;
    }
    footer {
      text-align: center;
      padding: 40px 20px;
      color: #517f94;
    }

    @media (max-width: 680px) {
      .navbar { flex-direction: column; gap: 12px; }
      .hero h1 { font-size: 2.2rem; }
      .product-grid { gap: 20px; }
    }
  </style>
</head>
<body>
<div class="navbar">
  <div class="logo">✦ ATHA STORE</div>
  <div class="nav-links" id="navLinks"></div>
</div>
<div class="hero">
  <div class="container">
    <h1>Akun Premium <span style="color:#2c7a9e;">✦</span> Legal Bergaransi</h1>
    <p>Editing, Streaming, Music — harga ramah kantong, stok selalu diperbarui</p>
  </div>
</div>
<div class="container" id="appContent"></div>
<footer>© ATHA STORE • Semua produk bergaransi • Hubungi admin via WhatsApp untuk info lebih lanjut</footer>

<!-- Modal Global -->
<div id="globalModal" class="modal">
  <div class="modal-card" id="modalInner"></div>
</div>

<script>
  // ====================== DATA ======================
  const DEFAULT_PRODUCTS = [
    { id: 1, name: "Alight Motion Private (1 Tahun)", category: "Editing Tools", price: 4000, stock: 10 },
    { id: 2, name: "Canva 1 Bulan", category: "Editing Tools", price: 2000, stock: 10 },
    { id: 3, name: "Canva 1 Tahun (Renew 1 Bulan)", category: "Editing Tools", price: 5000, stock: 10 },
    { id: 4, name: "Canva Lifetime", category: "Editing Tools", price: 6000, stock: 10 },
    { id: 5, name: "Canva Head 1 Bulan", category: "Editing Tools", price: 7000, stock: 10 },
    { id: 6, name: "CapCut Sharing 1 Bulan", category: "Editing Tools", price: 5000, stock: 10 },
    { id: 7, name: "CapCut Private 1 Bulan", category: "Editing Tools", price: 7000, stock: 10 },
    { id: 8, name: "VIU Lifetime", category: "Streaming & Movies", price: 4000, stock: 10 },
    { id: 9, name: "VIU Private Unlimited", category: "Streaming & Movies", price: 2000, stock: 10 },
    { id: 10, name: "Netflix 1 Profile 1 User 1 Bulan", category: "Streaming & Movies", price: 25000, stock: 10 },
    { id: 11, name: "Netflix 1 Profile 2 User 1 Bulan", category: "Streaming & Movies", price: 15000, stock: 10 },
    { id: 12, name: "Netflix Semi Private 1 Bulan", category: "Streaming & Movies", price: 27000, stock: 10 },
    { id: 13, name: "Netflix 1 Profile 1 User 1 Hari", category: "Streaming & Movies", price: 5000, stock: 10 },
    { id: 14, name: "Netflix 1 Profile 1 User 7 Hari", category: "Streaming & Movies", price: 10500, stock: 10 },
    { id: 15, name: "HBO MAX Sharing 8 User", category: "Streaming & Movies", price: 60000, stock: 10 },
    { id: 16, name: "HBO MAX Sharing 5 User", category: "Streaming & Movies", price: 10000, stock: 10 },
    { id: 17, name: "IQIYI Sharing 1 Bulan", category: "Streaming & Movies", price: 5000, stock: 10 },
    { id: 18, name: "Vidio Only TV 1 Tahun (Garansi 1 Bulan)", category: "Streaming & Movies", price: 5000, stock: 10 },
    { id: 19, name: "Vidio Sharing 2 User Mobile 1 Bulan", category: "Streaming & Movies", price: 17000, stock: 10 },
    { id: 20, name: "WeTV Sharing 6 User", category: "Streaming & Movies", price: 7000, stock: 10 },
    { id: 21, name: "WeTV Sharing 3 User", category: "Streaming & Movies", price: 8000, stock: 10 },
    { id: 22, name: "Spotify Individual Plan 1 Bulan", category: "Music & Social", price: 17500, stock: 10 },
    { id: 23, name: "YouTube Family Plan 1 Bulan", category: "Music & Social", price: 2000, stock: 10 },
    { id: 24, name: "YouTube Individual Plan 1 Bulan", category: "Music & Social", price: 8000, stock: 10 },
    { id: 25, name: "YouTube Head Plan 1 Bulan", category: "Music & Social", price: 9000, stock: 10 }
  ];

  let users = [];      // { id, name, email, phone, password, role }
  let products = [];
  let orders = [];     // { id, productId, productName, quantity, totalPrice, status, customerName, customerEmail, createdAt }
  let currentUser = null;
  const ADMIN_WA = "6281910545769";

  // helper
  function saveToLocal() {
    localStorage.setItem("athastore_users", JSON.stringify(users));
    localStorage.setItem("athastore_products", JSON.stringify(products));
    localStorage.setItem("athastore_orders", JSON.stringify(orders));
  }

  function loadData() {
    const storedUsers = localStorage.getItem("athastore_users");
    if (storedUsers) users = JSON.parse(storedUsers);
    else {
      users = [
        { id: 1, name: "Admin ATHA", email: "admin@athastore.com", phone: "08123456789", password: "admin123", role: "admin" },
        { id: 2, name: "Member Demo", email: "member@demo.com", phone: "08123456788", password: "member123", role: "member" }
      ];
    }
    const storedProducts = localStorage.getItem("athastore_products");
    if (storedProducts) products = JSON.parse(storedProducts);
    else products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
    const storedOrders = localStorage.getItem("athastore_orders");
    if (storedOrders) orders = JSON.parse(storedOrders);
    else orders = [];
  }

  // Kirim order ke WA admin
  function notifyAdminOrder(order) {
    const msg = `*ORDER BARU ATHA STORE* 🛒\n\nNama: ${order.customerName}\nEmail: ${order.customerEmail}\nProduk: ${order.productName}\nJumlah: ${order.quantity}\nTotal: Rp ${order.totalPrice.toLocaleString()}\nStatus: ${order.status}\n\nSegera diproses ya!`;
    window.open(`https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(msg)}`, "_blank");
  }

  // Place order (guest / member)
  function placeOrder(productId, quantity, customerName, customerEmail) {
    const product = products.find(p => p.id === productId);
    if (!product || product.stock < quantity) {
      alert("Stok tidak mencukupi!");
      return false;
    }
    // kurangi stok
    product.stock -= quantity;
    const total = product.price * quantity;
    const newOrder = {
      id: Date.now(),
      productId: product.id,
      productName: product.name,
      quantity: quantity,
      totalPrice: total,
      status: "proses",
      customerName: customerName,
      customerEmail: customerEmail || "guest@email.com",
      createdAt: new Date().toISOString()
    };
    orders.unshift(newOrder);
    saveToLocal();
    notifyAdminOrder(newOrder);
    alert(`✅ Pesanan berhasil! Admin akan segera menghubungi via WhatsApp.\nPesanan: ${product.name} x${quantity}`);
    renderApp();
    return true;
  }

  // Admin functions
  function adminUpdateProduct(pid, newStock, newPrice) {
    const prod = products.find(p => p.id === pid);
    if (prod) {
      prod.stock = parseInt(newStock);
      prod.price = parseInt(newPrice);
      saveToLocal();
      renderApp();
    }
  }

  function adminUpdateOrderStatus(orderId, newStatus) {
    const order = orders.find(o => o.id === orderId);
    if (order) {
      order.status = newStatus;
      saveToLocal();
      renderApp();
    }
  }

  function backupToWhatsApp() {
    let prodText = "📦 *DATA PRODUK ATHA STORE*\n";
    products.forEach(p => {
      prodText += `• ${p.name} | Rp ${p.price.toLocaleString()} | Stok: ${p.stock}\n`;
    });
    let orderText = "\n📋 *DATA ORDER*\n";
    orders.forEach(o => {
      orderText += `ID:${o.id} | ${o.productName} | ${o.quantity} pcs | Status: ${o.status} | ${o.customerName}\n`;
    });
    const msg = `${prodText}\n${orderText}\nWaktu backup: ${new Date().toLocaleString()}`;
    window.open(`https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(msg)}`, "_blank");
  }

  // Auth modals
  function showLoginModal() {
    const modal = document.getElementById("globalModal");
    const inner = document.getElementById("modalInner");
    inner.innerHTML = `
      <h3><i class="fas fa-key"></i> Masuk</h3>
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="loginPassword" placeholder="Password">
      <div class="role-select">
        <div class="role-opt active" data-role="member">Member</div>
        <div class="role-opt" data-role="admin">Admin</div>
      </div>
      <button id="loginBtnAction">Login</button>
      <div class="switch-link" id="toRegister">Belum punya akun? Daftar</div>
      <div class="switch-link" id="toForgot">Lupa password?</div>
    `;
    modal.style.display = "flex";
    attachRoleSelect();
    document.getElementById("loginBtnAction").onclick = () => {
      const email = document.getElementById("loginEmail").value;
      const pwd = document.getElementById("loginPassword").value;
      const selectedRole = document.querySelector(".role-opt.active").dataset.role;
      const user = users.find(u => u.email === email && u.password === pwd && u.role === selectedRole);
      if (user) {
        currentUser = { id: user.id, name: user.name, email: user.email, role: user.role };
        closeModal();
        renderApp();
      } else alert("Email/password salah atau role tidak sesuai");
    };
    document.getElementById("toRegister").onclick = () => showRegisterModal();
    document.getElementById("toForgot").onclick = () => showForgotModal();
  }

  function showRegisterModal() {
    const modal = document.getElementById("globalModal");
    const inner = document.getElementById("modalInner");
    inner.innerHTML = `
      <h3><i class="fas fa-user-plus"></i> Daftar Member</h3>
      <input type="text" id="regName" placeholder="Nama Lengkap">
      <input type="email" id="regEmail" placeholder="Email">
      <input type="tel" id="regPhone" placeholder="Nomor Telepon">
      <input type="password" id="regPassword" placeholder="Password">
      <button id="registerAction">Daftar</button>
      <div class="switch-link" id="toLogin">Sudah punya akun? Login</div>
    `;
    document.getElementById("registerAction").onclick = () => {
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const pwd = document.getElementById("regPassword").value;
      if (!name || !email || !phone || !pwd) return alert("Lengkapi semua field");
      if (users.find(u => u.email === email)) return alert("Email sudah terdaftar");
      if (users.find(u => u.phone === phone)) return alert("Nomor sudah terdaftar");
      const newId = users.length + 1;
      users.push({ id: newId, name, email, phone, password: pwd, role: "member" });
      saveToLocal();
      alert("Registrasi berhasil! Silakan login.");
      showLoginModal();
    };
    document.getElementById("toLogin").onclick = () => showLoginModal();
    modal.style.display = "flex";
  }

  function showForgotModal() {
    const modal = document.getElementById("globalModal");
    const inner = document.getElementById("modalInner");
    inner.innerHTML = `
      <h3><i class="fas fa-lock"></i> Reset Password</h3>
      <input type="text" id="resetIdentifier" placeholder="Email atau Nomor Telepon">
      <button id="resetBtn">Reset Password</button>
      <div class="switch-link" id="backLogin">Kembali Login</div>
    `;
    document.getElementById("resetBtn").onclick = () => {
      const identifier = document.getElementById("resetIdentifier").value;
      const user = users.find(u => u.email === identifier || u.phone === identifier);
      if (!user) return alert("Data tidak ditemukan");
      const newPass = prompt("Masukkan password baru (min 4 karakter):");
      if (newPass && newPass.length >= 4) {
        user.password = newPass;
        saveToLocal();
        alert("Password berhasil diubah! Silakan login.");
        closeModal();
        showLoginModal();
      } else alert("Password minimal 4 karakter");
    };
    document.getElementById("backLogin").onclick = () => showLoginModal();
    modal.style.display = "flex";
  }

  function attachRoleSelect() {
    document.querySelectorAll(".role-opt").forEach(opt => {
      opt.onclick = () => {
        document.querySelectorAll(".role-opt").forEach(o => o.classList.remove("active"));
        opt.classList.add("active");
      };
    });
  }

  function closeModal() {
    document.getElementById("globalModal").style.display = "none";
  }

  // Order modal (guest or member)
  function showOrderModal(productId, productName, stockAvail) {
    const isMember = currentUser && currentUser.role === "member";
    const defaultName = isMember ? currentUser.name : "";
    const defaultEmail = isMember ? currentUser.email : "";
    const modal = document.getElementById("globalModal");
    const inner = document.getElementById("modalInner");
    inner.innerHTML = `
      <h3>Pesan ${escapeHtml(productName)}</h3>
      <input type="number" id="orderQty" placeholder="Jumlah" min="1" max="${stockAvail}" value="1">
      <input type="text" id="orderName" placeholder="Nama lengkap" value="${escapeHtml(defaultName)}" ${isMember ? 'readonly' : ''}>
      <input type="email" id="orderEmail" placeholder="Email" value="${escapeHtml(defaultEmail)}" ${isMember ? 'readonly' : ''}>
      <button id="confirmOrderBtn">Konfirmasi & Kirim ke WA</button>
      <div class="switch-link" id="cancelOrder">Batal</div>
    `;
    modal.style.display = "flex";
    document.getElementById("confirmOrderBtn").onclick = () => {
      let qty = parseInt(document.getElementById("orderQty").value);
      let name = document.getElementById("orderName").value.trim();
      let email = document.getElementById("orderEmail").value.trim();
      if (isNaN(qty) || qty < 1) return alert("Jumlah tidak valid");
      if (!name) return alert("Nama harus diisi");
      if (!email) return alert("Email harus diisi");
      if (qty > stockAvail) return alert(`Stok hanya ${stockAvail}`);
      placeOrder(productId, qty, name, email);
      closeModal();
    };
    document.getElementById("cancelOrder").onclick = () => closeModal();
  }

  // RENDER UI
  function renderApp() {
    const container = document.getElementById("appContent");
    const navDiv = document.getElementById("navLinks");
    if (!container) return;

    // navbar
    let navHtml = `<a href="#" id="navHome">🏠 Beranda</a>`;
    if (currentUser) {
      navHtml += `<span class="user-badge"><i class="fas fa-user-circle"></i> ${currentUser.name} (${currentUser.role === "admin" ? "Admin" : "Member"})</span>`;
      if (currentUser.role === "admin") navHtml += `<a href="#" id="navAdmin">⚙️ Dashboard Admin</a>`;
      else navHtml += `<a href="#" id="navMyOrders">📋 Pesanan Saya</a>`;
      navHtml += `<button id="logoutBtn">Keluar</button>`;
    } else {
      navHtml += `<button id="loginBtn">Masuk / Daftar</button>`;
    }
    navDiv.innerHTML = navHtml;

    document.getElementById("navHome")?.addEventListener("click", (e) => { e.preventDefault(); showHome(); });
    document.getElementById("navAdmin")?.addEventListener("click", (e) => { e.preventDefault(); if(currentUser?.role==="admin") showAdminPanel(); });
    document.getElementById("navMyOrders")?.addEventListener("click", (e) => { e.preventDefault(); if(currentUser?.role==="member") showMemberOrders(); });
    document.getElementById("logoutBtn")?.addEventListener("click", () => { currentUser = null; renderApp(); });
    document.getElementById("loginBtn")?.addEventListener("click", () => showLoginModal());

    showHome();

    function showHome() {
      let html = `<div class="product-grid">`;
      products.forEach(prod => {
        const stockClass = prod.stock < 3 ? "low" : "";
        html += `
          <div class="product-card">
            <div class="product-icon"><i class="fas ${getIcon(prod.name)}"></i></div>
            <div class="product-name">${escapeHtml(prod.name)}</div>
            <div class="price-stock">
              <span class="price">Rp ${prod.price.toLocaleString()}</span>
              <span class="stock ${stockClass}"><i class="fas fa-boxes"></i> Stok: ${prod.stock}</span>
            </div>
            <button class="order-btn" data-id="${prod.id}" data-name="${escapeHtml(prod.name)}" data-stock="${prod.stock}" ${prod.stock <= 0 ? 'disabled' : ''}>
              <i class="fab fa-whatsapp"></i> Pesan Sekarang
            </button>
          </div>
        `;
      });
      html += `</div>`;
      container.innerHTML = html;
      document.querySelectorAll(".order-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const pid = parseInt(btn.dataset.id);
          const pname = btn.dataset.name;
          const stock = parseInt(btn.dataset.stock);
          showOrderModal(pid, pname, stock);
        });
      });
    }

    function showAdminPanel() {
      let html = `<div class="admin-panel">
        <h2><i class="fas fa-shield-alt"></i> Panel Admin</h2>
        <div class="tab-bar">
          <button class="tab active" id="tabProducts">📦 Produk</button>
          <button class="tab" id="tabOrders">📑 Order</button>
          <button class="tab" id="tabBackup">💾 Backup WA</button>
        </div>
        <div id="adminContent"></div>
      </div>`;
      container.innerHTML = html;

      const contentDiv = document.getElementById("adminContent");
      const renderProducts = () => {
        let tbl = `<table><thead><tr><th>Produk</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead><tbody>`;
        products.forEach(p => {
          tbl += `<tr>
            <td>${escapeHtml(p.name)}</td>
            <td><input class="small-input" type="number" id="price-${p.id}" value="${p.price}"></td>
            <td><input class="small-input" type="number" id="stock-${p.id}" value="${p.stock}" min="0"></td>
            <td><button class="updateProd" data-id="${p.id}">Update</button></td>
          </tr>`;
        });
        tbl += `</tbody></table>`;
        contentDiv.innerHTML = tbl;
        document.querySelectorAll(".updateProd").forEach(btn => {
          btn.onclick = () => {
            const id = parseInt(btn.dataset.id);
            const newPrice = document.getElementById(`price-${id}`).value;
            const newStock = document.getElementById(`stock-${id}`).value;
            adminUpdateProduct(id, newStock, newPrice);
          };
        });
      };
      const renderOrders = () => {
        if (orders.length === 0) { contentDiv.innerHTML = "<p>Belum ada order</p>"; return; }
        let tbl = `<table><thead><tr><th>Produk</th><th>Pembeli</th><th>Jumlah</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody>`;
        orders.forEach(o => {
          tbl += `<tr>
            <td>${escapeHtml(o.productName)}</td>
            <td>${escapeHtml(o.customerName)}</td>
            <td>${o.quantity}</td>
            <td>Rp ${o.totalPrice.toLocaleString()}</td>
            <td>
              <select class="statusSelect" data-id="${o.id}">
                <option value="proses" ${o.status === "proses" ? "selected" : ""}>Proses</option>
                <option value="berhasil" ${o.status === "berhasil" ? "selected" : ""}>Berhasil</option>
                <option value="gagal" ${o.status === "gagal" ? "selected" : ""}>Gagal</option>
              </select>
            </td>
            <td><button class="updateOrder" data-id="${o.id}">Update</button></td>
          </tr>`;
        });
        tbl += `</tbody></table>`;
        contentDiv.innerHTML = tbl;
        document.querySelectorAll(".updateOrder").forEach(btn => {
          btn.onclick = () => {
            const oid = parseInt(btn.dataset.id);
            const select = document.querySelector(`.statusSelect[data-id="${oid}"]`);
            adminUpdateOrderStatus(oid, select.value);
          };
        });
      };
      const renderBackup = () => {
        contentDiv.innerHTML = `<button class="backup-wa" style="background:#25D366; padding:12px 24px; border-radius:50px;">📲 Backup ke WhatsApp Admin</button>`;
        document.querySelector(".backup-wa").onclick = backupToWhatsApp;
      };
      document.getElementById("tabProducts").onclick = () => { setActiveTab("tabProducts"); renderProducts(); };
      document.getElementById("tabOrders").onclick = () => { setActiveTab("tabOrders"); renderOrders(); };
      document.getElementById("tabBackup").onclick = () => { setActiveTab("tabBackup"); renderBackup(); };
      function setActiveTab(activeId) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.getElementById(activeId).classList.add("active");
      }
      renderProducts();
    }

    function showMemberOrders() {
      const myOrders = orders.filter(o => o.customerEmail === currentUser.email);
      if (myOrders.length === 0) {
        container.innerHTML = `<div class="orders-panel"><h2>Pesanan Saya</h2><p>Belum ada pesanan.</p></div>`;
        return;
      }
      let html = `<div class="orders-panel"><h2>📋 Pesanan Saya</h2><table><thead><tr><th>Produk</th><th>Jumlah</th><th>Total</th><th>Status</th><th>Tanggal</th></tr></thead><tbody>`;
      myOrders.forEach(o => {
        html += `<tr><td>${escapeHtml(o.productName)}</td><td>${o.quantity}</td><td>Rp ${o.totalPrice.toLocaleString()}</td><td>${o.status === "berhasil" ? "✅ Berhasil" : (o.status === "gagal" ? "❌ Gagal" : "⏳ Proses")}</td><td>${new Date(o.createdAt).toLocaleDateString()}</td></tr>`;
      });
      html += `</tbody></table></div>`;
      container.innerHTML = html;
    }
  }

  function getIcon(name) {
    const n = name.toLowerCase();
    if (n.includes("alight")) return "fa-film";
    if (n.includes("canva")) return "fa-palette";
    if (n.includes("capcut")) return "fa-video";
    if (n.includes("netflix")) return "fa-tv";
    if (n.includes("spotify")) return "fa-music";
    if (n.includes("youtube")) return "fa-youtube";
    return "fa-crown";
  }

  function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

  window.onclick = function(e) { if (e.target === document.getElementById("globalModal")) closeModal(); };
  loadData();
  renderApp();
</script>
</body>
</html>
